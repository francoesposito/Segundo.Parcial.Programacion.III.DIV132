<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME INDEX - Carrito</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>
    <div class="header-container">
      <div style="display:flex;align-items:center;">
        <img src="http://localhost:3000/assets/img/favicon.png" alt="logo" class="site-logo">
        <h1>Carro de Compras</h1>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="btn btn-theme">Cambiar Tema</button>
        <a href="index.html" class="btn btn-secondary">← Volver a la Tienda</a>
      </div>
    </div>
  </header>

  <main>
    <section class="cart-section">
      <h2>Juegos Seleccionados</h2>
      <div id="cart-container">
        <!-- Se rellena dinámicamente desde JS -->
      </div>

      <div id="checkout-form-container" class="checkout-box" style="display: none;">
        <h3>Datos de la Compra</h3>
        <form id="checkout-form" onsubmit="event.preventDefault(); checkout();">
          <div class="form-group">
            <label for="customer-name">Nombre del Comprador:</label>
            <input type="text" id="customer-name" required placeholder="Ingresá tu nombre">
          </div>
          <div class="form-group">
            <label for="payment-method">Método de Pago:</label>
            <select id="payment-method" required>
              <option value="">Seleccioná un método</option>
              <option value="Efectivo">Efectivo</option>
              <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
              <option value="Tarjeta de Débito">Tarjeta de Débito</option>
              <option value="Mercado Pago">Mercado Pago</option>
            </select>
          </div>
          <div class="cart-actions">
            <button type="button" class="btn btn-danger" onclick="clearCart()">Vaciar Carro</button>
            <button type="submit" class="btn btn-success">Confirmar Compra</button>
          </div>
        </form>
      </div>
    </section>
  </main>


  <script src="js/theme.js"></script>
  <!-- jsPDF CDN para generar PDF directamente desde la página del carrito -->
  <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script>

    document.addEventListener("DOMContentLoaded", () => {
      if (typeof initTheme === "function") initTheme();
      if (typeof renderCart === "function") renderCart();
    });
  </script>
</body>

</html>
