<!-- 
  ========================================================================
  VISTA DEL CARRITO DE COMPRAS (cart.html)
  ========================================================================
  Propósito:
  - Muestra el listado de productos seleccionados por el cliente.
  - Permite modificar las cantidades de los productos en el carrito.
  - Permite eliminar productos del carrito.
  - Muestra el cálculo del total de la compra.
  - Ofrece la opción de proceder al pago / confirmar la compra (generar el ticket).
  - Permite elegir el método de pago antes de confirmar.

  Elementos Clave del DOM esperados:
  - Tabla o listado con los productos del carrito (nombre, cantidad, precio unitario, subtotal, botón eliminar).
  - Indicador del precio total acumulado.
  - Selector del método de pago (Efectivo, Tarjeta, Débito, etc.).
  - Botón "Confirmar Compra" (que creará la venta en el backend).
  - Botón "Vaciar Carrito".
  - Botón "Seguir Comprando" (vuelve al catálogo).
  - Botón/Toggle para cambiar el tema visual (claro/oscuro).

  Scripts asociados:
  - js/theme.js (Control global del tema claro/oscuro)
  - js/api.js (Llamadas fetch al backend para registrar la venta / descontar stock)
  - js/cart.js (Lógica de administración del carrito en localStorage, renderizado y confirmación de la venta)
-->
