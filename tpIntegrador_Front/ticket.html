<link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>
    <div class="header-container">
      <div style="display:flex;align-items:center;">
        <img src="http://localhost:3000/assets/img/favicon.png" alt="logo" class="site-logo">
        <h1>Ticket de Compra</h1>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="btn btn-theme">Cambiar Tema</button>
      </div>
    </div>
  </header>

  <main>
    <section class="ticket-section">
      <div id="ticket-container">
      </div>

      <div style="margin-top:20px; display:flex; gap:10px;">
        <button id="boton_imprimir" class="btn btn-success">Imprimir / Descargar PDF</button>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ticket.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof initTheme === 'function') initTheme();
      if (typeof initTicket === 'function') initTicket();
    });
  </script>
</body>

</html>
