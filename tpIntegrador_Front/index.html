<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME INDEX- Catálogo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>
    <div class="header-container">
      <div style="display:flex;align-items:center;">
        <img src="http://localhost:3000/assets/img/favicon.png" alt="logo" class="site-logo">
        <h1>GAME INDEX</h1>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="btn btn-theme">Cambiar Tema</button>
        <a href="cart.html" class="btn btn-cart">Ver Carrito <span id="cart-count">(0)</span></a>
      </div>
    </div>
  </header>

  <main>
    <section class="filters-section">
      <h2>Categorías de Juegos</h2>
      <div class="categories-filters">
        <button class="btn btn-filter" data-category="Todos" onclick="filterByCategory('Todos')">Todos</button>
        <button class="btn btn-filter" data-category="carreras" onclick="filterByCategory('carreras')">Carreras</button>
        <button class="btn btn-filter" data-category="disparos" onclick="filterByCategory('disparos')">Disparos</button>
        <button class="btn btn-filter" data-category="aventuras"
          onclick="filterByCategory('aventuras')">Aventuras</button>
      </div>
    </section>

    <section class="catalog-section">
      <h2>Nuestra Tienda</h2>
      <div id="products-container" class="products-grid">
      </div>
    </section>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/index.js"></script>
  <script>

    document.addEventListener("DOMContentLoaded", () => {
      if (typeof initTheme === "function") initTheme();
      if (typeof initCatalog === "function") initCatalog();
      if (typeof updateCartCount === "function") updateCartCount();
    });
  </script>
</body>

</html>
