<!-- 
  ========================================================================
  VISTA PRINCIPAL / CATÁLOGO (index.html)
  ========================================================================
  Propósito:
  - Punto de entrada para el cliente en el Kiosco Autoservicio.
  - Muestra la bienvenida y el catálogo de productos disponibles.
  - Permite filtrar productos por categorías.
  - Permite seleccionar un producto para ver su detalle o agregarlo 
    directamente al carrito.

  Elementos Clave del DOM esperados:
  - Selector o botones de categorías para filtrar el catálogo.
  - Contenedor principal donde se renderizará dinámicamente la lista de productos.
  - Botón o enlace visible para acceder al Carrito de Compras (cart.html).
  - Botón/Toggle para cambiar el tema visual (claro/oscuro).

  Scripts asociados:
  - js/theme.js (Control global del tema claro/oscuro)
  - js/api.js (Llamadas fetch al backend)
  - js/index.js (Lógica de inicialización, filtros y renderizado de la grilla)
-->
